<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ARK Manager</title>
  <link rel="apple-touch-icon" href="3A438E39-9D68-43D7-A208-45C20F63CE40.jpeg">
  <link rel="icon" href="3A438E39-9D68-43D7-A208-45C20F63CE40.jpeg">
  <style>
:root{
  --bg:#08111c;
  --bg2:#0d1827;
  --line:rgba(255,255,255,.09);
  --text:#eef6ff;
  --muted:#91a5bb;
  --blue:#67bbff;
  --cyan:#73f0d1;
  --yellow:#ffb24d;
  --green:#70e0a5;
  --danger0:#ffb4b4;
  --danger1:#ff9b9b;
  --danger2:#ff8585;
  --danger3:#ff6f6f;
  --danger4:#ff5858;
  --danger5:#ff4545;
  --shadow:0 16px 40px rgba(0,0,0,.28);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  height:100%;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at top, rgba(103,187,255,.16), transparent 32%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-repeat:no-repeat;
  background-attachment:fixed;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}

body{
  min-height:100dvh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  border:none;
  cursor:pointer;
}

input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  background:rgba(255,255,255,.045);
  color:var(--text);
  border-radius:14px;
  padding:12px 14px;
  outline:none;
}

textarea{
  resize:vertical;
  min-height:92px;
}

input:focus,select:focus,textarea:focus{
  border-color:rgba(103,187,255,.75);
  box-shadow:0 0 0 3px rgba(103,187,255,.12);
}

.app-shell{
  width:min(100%,820px);
  margin:0 auto;
  min-height:100dvh;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  background:transparent;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:calc(16px + env(safe-area-inset-top)) 16px 14px;
  backdrop-filter:blur(14px);
  background:rgba(7,13,21,.78);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.brand-title{
  font-size:28px;
  font-weight:900;
  line-height:1.02;
  letter-spacing:.10em;
  color:#eef7ff;
  text-shadow:
    0 0 18px rgba(103,187,255,.18),
    0 2px 10px rgba(0,0,0,.35);
}

.brand-icon{
  width:52px;
  height:52px;
  object-fit:contain;
  flex:0 0 auto;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));
}

.content{
  padding:16px;
  display:grid;
  gap:12px;
}

.toolbar-card{
  display:grid;
  gap:12px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:22px;
  background:linear-gradient(180deg, rgba(16,30,45,.96), rgba(10,18,29,.96));
  box-shadow:var(--shadow);
}

.toolbar-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

.toolbar-title{
  font-size:15px;
  font-weight:900;
}

.toolbar-sub{
  margin-top:4px;
  font-size:12px;
  color:var(--muted);
  line-height:1.45;
}

.counter-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:34px;
  padding:0 12px;
  border-radius:999px;
  background:rgba(103,187,255,.12);
  border:1px solid rgba(103,187,255,.2);
  color:#dceeff;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}

.counter-chip strong{
  font-size:15px;
}

.compact-field{
  gap:6px;
}

.empty-state{
  display:grid;
  place-items:center;
  text-align:center;
  gap:6px;
  padding:48px 18px;
  border:1px dashed rgba(255,255,255,.12);
  border-radius:26px;
  background:rgba(255,255,255,.03);
  color:var(--muted);
}

.empty-state.hidden{
  display:none !important;
}

.empty-state h2{
  margin:0;
  color:var(--text);
  font-size:22px;
}

.empty-state p{
  margin:0;
  font-size:14px;
}

.empty-icon{
  font-size:42px;
}

.timer-list{
  display:grid;
  gap:10px;
}

.card{
  display:grid;
  grid-template-columns:96px minmax(0,1fr);
  gap:10px;
  padding:10px;
  background:linear-gradient(180deg, rgba(17,33,50,.96), rgba(12,24,37,.96));
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
}

.card.expired{
  border-color:rgba(255,117,117,.4);
}

.img{
  width:96px;
  aspect-ratio:1/1;
  border-radius:16px;
  background:
    linear-gradient(135deg, rgba(103,187,255,.18), rgba(115,240,209,.08)),
    rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  position:relative;
  overflow:hidden;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.overlay-badge{
  position:absolute;
  right:0;
  bottom:0;
  width:50%;
  height:50%;
  object-fit:contain;
  border-top-left-radius:8px;
  background:rgba(6,12,20,.4);
  backdrop-filter:blur(2px);
}

.info{
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  grid-template-areas:
    "name actions"
    "tags actions"
    "collapse actions"
    "remain actions";
  column-gap:10px;
  row-gap:6px;
  align-items:start;
}

.name-row{
  grid-area:name;
  min-width:0;
}

.tags-row{
  grid-area:tags;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  min-width:0;
}

.timer-name{
  font-size:16px;
  font-weight:800;
  line-height:1.2;
  word-break:break-word;
}

.tag{
  display:inline-flex;
  align-items:center;
  min-height:24px;
  padding:0 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}

.map-tag{
  background:rgba(103,187,255,.14);
  color:#cae7ff;
}

.type-tag{
  background:rgba(255,210,124,.14);
  color:#ffdca2;
}

.coord-tag{
  background:rgba(112,224,165,.14);
  color:#c8f3d9;
}

.collapse-row{
  grid-area:collapse;
  display:grid;
  gap:4px;
}

.small{
  display:flex;
  gap:6px;
  align-items:center;
  min-width:0;
  font-size:12px;
  color:var(--muted);
  line-height:1.25;
}

.small strong{
  color:#dbe9f7;
  font-size:12px;
  font-weight:700;
}

.remain{
  grid-area:remain;
  display:flex;
  gap:8px;
  align-items:flex-end;
  min-width:0;
}

.remain-label{
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
}

.remain-value{
  font-size:18px;
  font-weight:800;
  line-height:1.15;
  letter-spacing:.02em;
}

.remain-value.green{color:var(--green);}
.remain-value.orange{color:var(--yellow);}
.remain-value.red0{color:var(--danger0);}
.remain-value.red1{color:var(--danger1);}
.remain-value.red2{color:var(--danger2);}
.remain-value.red3{color:var(--danger3);}
.remain-value.red4{color:var(--danger4);}
.remain-value.red5{color:var(--danger5);}

.actions{
  grid-area:actions;
  display:flex;
  flex-direction:column;
  gap:6px;
  align-self:stretch;
}

.action-btn{
  min-width:72px;
  min-height:32px;
  padding:0 12px;
  border-radius:12px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  color:var(--text);
}

.reset-btn{
  background:rgba(103,187,255,.12);
  border:1px solid rgba(103,187,255,.26);
}

.edit-btn{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.09);
}

.delete-btn{
  background:rgba(255,90,90,.12);
  border:1px solid rgba(255,90,90,.24);
  color:#ffd0d0;
}

.move-actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}

.move-btn{
  min-width:0;
  padding:0;
  font-size:15px;
  background:rgba(115,240,209,.1);
  border:1px solid rgba(115,240,209,.18);
}

.move-btn:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.fab{
  position:fixed;
  right:18px;
  bottom:calc(18px + env(safe-area-inset-bottom));
  z-index:30;
  width:62px;
  height:62px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  color:#062238;
  font-size:34px;
  font-weight:900;
  box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.hidden{
  display:none !important;
}

.hidden-input{
  display:none !important;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:39;
  background:rgba(0,0,0,.52);
  backdrop-filter:blur(4px);
}

.modal{
  position:fixed;
  left:50%;
  bottom:calc(12px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:40;
  width:min(calc(100% - 20px),760px);
  max-height:min(86vh,920px);
  overflow:auto;
  border-radius:28px;
  border:1px solid var(--line);
  background:linear-gradient(180deg, rgba(18,33,49,.98), rgba(9,16,26,.98));
  box-shadow:0 30px 70px rgba(0,0,0,.45);
}

.modal-sub{
  margin:0 0 4px;
  font-size:11px;
  letter-spacing:.18em;
  color:var(--blue);
}

.modal-header{
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  padding:18px 16px 14px;
  background:rgba(10,18,29,.9);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.modal-header h2{
  margin:0;
  line-height:1.1;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  background:rgba(255,255,255,.06);
  color:var(--text);
  font-size:24px;
  flex:0 0 auto;
}

.form{
  display:grid;
  gap:16px;
  padding:16px;
}

.field{
  display:grid;
  gap:8px;
}

.field > span{
  font-size:14px;
  font-weight:800;
}

.map-preview-button{
  display:block;
  width:100%;
  padding:0;
  background:none;
  border:none;
}

.map-preview{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.08);
  background:
    linear-gradient(135deg, rgba(103,187,255,.18), rgba(115,240,209,.1)),
    rgba(255,255,255,.04);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  overflow:hidden;
}

.map-preview.is-empty{
  background:
    linear-gradient(135deg, rgba(103,187,255,.12), rgba(115,240,209,.06)),
    rgba(255,255,255,.04);
}

.map-pin{
  position:absolute;
  left:0;
  top:0;
  width:20px;
  height:20px;
  border-radius:50% 50% 50% 0;
  transform:translate(-50%,-100%) rotate(-45deg);
  background:linear-gradient(135deg,#ff7b7b,#ff3f3f);
  border:2px solid rgba(255,255,255,.9);
  box-shadow:0 8px 18px rgba(0,0,0,.35);
  z-index:3;
}

.map-pin::after{
  content:"";
  position:absolute;
  inset:4px;
  border-radius:50%;
  background:rgba(255,255,255,.94);
}

.check-row{
  display:inline-flex;
  align-items:center;
  gap:10px;
  width:fit-content;
  font-size:14px;
  font-weight:700;
  color:#dcecff;
}

.check-row input{
  width:18px;
  height:18px;
  padding:0;
  margin:0;
  accent-color:#67bbff;
}

.coord-grid,
.time-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.time-grid{
  grid-template-columns:repeat(3,1fr);
}

.chip-grid{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.chip{
  position:relative;
}

.chip input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.chip span{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:40px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.045);
  font-size:13px;
  font-weight:700;
}

.chip input:checked + span{
  border-color:rgba(103,187,255,.58);
  background:rgba(103,187,255,.14);
  color:#d7eeff;
}

.material-days{
  font-size:12px;
  color:#cfe6ff;
}

.submit-btn{
  min-height:52px;
  border-radius:16px;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  color:#062238;
  font-size:16px;
  font-weight:900;
}

.confirm-overlay{
  position:fixed;
  inset:0;
  z-index:80;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(4px);
}

.confirm-box{
  width:min(92vw,360px);
  border-radius:20px;
  border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg, rgba(18,33,49,.98), rgba(9,16,26,.98));
  box-shadow:0 30px 70px rgba(0,0,0,.45);
  padding:18px;
}

.confirm-box h3{
  margin:0 0 10px;
  font-size:18px;
}

.confirm-box p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
}

.confirm-actions{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.confirm-btn{
  flex:1;
  min-height:44px;
  border-radius:14px;
  font-weight:800;
}

.confirm-btn.ghost{
  background:rgba(255,255,255,.06);
  color:var(--text);
}

.confirm-btn.solid{
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  color:#062238;
}

@media (max-width:560px){
  .brand-title{
    font-size:24px;
  }

  .brand-icon{
    width:40px;
    height:40px;
  }

  .toolbar-head{
    flex-direction:column;
    align-items:stretch;
  }

  .counter-chip{
    width:fit-content;
  }

  .card{
    grid-template-columns:78px minmax(0,1fr);
    gap:8px;
    padding:8px;
  }

  .img{
    width:78px;
    border-radius:14px;
  }

  .info{
    grid-template-columns:minmax(0,1fr) 70px;
    row-gap:5px;
  }

  .timer-name{
    font-size:15px;
  }

  .remain-value{
    font-size:16px;
  }

  .action-btn{
    min-width:70px;
    min-height:30px;
    padding:0 8px;
    font-size:11px;
  }

  .modal{
    width:min(calc(100% - 12px),760px);
    bottom:calc(6px + env(safe-area-inset-bottom));
    max-height:min(88vh,920px);
  }
}


.toolbar-card{
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
}

.compact-field{
  justify-self:end;
  width:auto;
  min-width:164px;
}

.compact-field > span{
  font-size:11px;
  line-height:1;
  color:var(--muted);
}

#sortSelect{
  min-width:164px;
  width:auto;
  height:36px;
  padding:6px 34px 6px 12px;
  border-radius:12px;
  font-size:12px;
  font-weight:800;
  background:rgba(255,255,255,.06);
}

.overlay.hidden,
.confirm-overlay.hidden{
  pointer-events:none;
}

.fab{
  z-index:90;
}

.card-pin{
  width:16px;
  height:16px;
  border-width:1.5px;
  box-shadow:0 6px 12px rgba(0,0,0,.28);
}

.card-pin::after{
  inset:3px;
}

@media (max-width:560px){
  .toolbar-card{
    grid-template-columns:1fr auto;
    gap:10px;
  }

  .toolbar-head{
    min-width:0;
  }

  .toolbar-title{
    font-size:14px;
  }

  .toolbar-sub{
    font-size:11px;
    line-height:1.35;
  }

  .compact-field{
    min-width:132px;
  }

  #sortSelect{
    min-width:132px;
    max-width:150px;
    height:32px;
    padding:4px 28px 4px 10px;
    font-size:11px;
    border-radius:10px;
  }

  .toolbar-head{
    flex-direction:row;
    align-items:center;
  }
}


.toolbar-card-compact{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  padding:10px 12px;
}

.toolbar-card-compact #sortSelect{
  width:auto;
  min-width:152px;
  max-width:100%;
  height:34px;
  padding:4px 30px 4px 10px;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
}

.img{
  cursor:pointer;
}

.img:focus-visible{
  outline:2px solid rgba(103,187,255,.9);
  outline-offset:2px;
}

.map-viewer{
  position:fixed;
  inset:0;
  z-index:120;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.map-viewer-backdrop{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(4px);
}

.map-viewer-panel{
  position:relative;
  z-index:1;
  width:min(92vw,720px);
}

.map-viewer-image{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.12);
  background-color:#07101a;
  background-size:contain;
  background-position:center;
  background-repeat:no-repeat;
  box-shadow:0 24px 60px rgba(0,0,0,.45);
  overflow:hidden;
}

.map-viewer-close{
  position:absolute;
  top:10px;
  right:10px;
  z-index:2;
  width:38px;
  height:38px;
  border-radius:999px;
  background:rgba(7,13,21,.72);
  border:1px solid rgba(255,255,255,.12);
  color:#eef6ff;
  font-size:24px;
  line-height:1;
}

.viewer-pin{
  width:24px;
  height:24px;
}

.viewer-pin::after{
  inset:5px;
}

@media (max-width:560px){
  .toolbar-card-compact{
    padding:8px 10px;
  }

  .toolbar-card-compact #sortSelect{
    min-width:138px;
    height:32px;
    font-size:11px;
  }

  .map-viewer{
    padding:12px;
  }

  .map-viewer-panel{
    width:min(100vw - 24px,720px);
  }

  .map-viewer-image{
    border-radius:16px;
  }

  .map-viewer-close{
    top:8px;
    right:8px;
    width:34px;
    height:34px;
    font-size:22px;
  }
}

/* ARK Manager: characters */
.brand-title{font-size:26px;letter-spacing:.025em}
.manager-tabs{display:flex;gap:8px;padding:14px 16px 0}
.manager-tabs button{flex:1;padding:13px;border-radius:14px;background:rgba(255,255,255,.05);color:var(--muted);font-weight:700;border:1px solid var(--line)}
.manager-tabs .selected{background:rgba(103,187,255,.16);color:var(--blue);border-color:rgba(103,187,255,.4)}
.section-heading{display:flex;align-items:center;justify-content:space-between;margin:8px 0 18px}.section-heading h1{font-size:22px;margin:0}.section-heading span{color:var(--muted)}
.character-list{display:grid;gap:12px}.character-card{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:16px;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:20px;color:var(--text)}

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-title">ARK Manager</div>
      <img class="brand-icon" src="6A24B32B-C572-492B-AA91-5B2667D4133F.png" alt="icon">

      <button id="timerTab" role="tab" aria-selected="false" aria-controls="timerPage">タイマー</button>
    </nav>
    <main id="characterPage" class="content" role="tabpanel" aria-labelledby="characterTab">
      <div id="characterListPage">

        <section id="characterEmpty" class="empty-state"><div class="empty-icon">◉</div><h2>キャラがありません</h2><p>右下の＋ボタンから追加してください</p></section>
        <div id="characterList" class="character-list"></div><div class="server-settings-bar manager-settings-bottom"><button id="openLevelSettings" type="button" class="manager-small-btn">⚙ レベル上限設定</button><button id="openServerSettings" type="button" class="manager-small-btn">⚙ マップ・サーバー設定</button></div>
      </div>
      <section id="characterDetail" class="hidden"></section>
    </main>
    <button id="addCharacter" class="fab" type="button" aria-label="キャラ追加">＋</button>
    <dialog id="characterDialog" class="character-dialog" aria-labelledby="characterDialogTitle">
      <div class="modal-header"><h2 id="characterDialogTitle">キャラ追加</h2><button id="closeCharacterDialog" class="icon-btn" type="button" aria-label="閉じる">×</button></div>
      <form id="characterForm" class="form"><div id="characterFormFields"></div><button id="characterSubmit" class="submit-btn" type="submit">保存</button></form>
    </dialog>
    <dialog id="serverSettingsDialog" class="character-dialog"><div class="modal-header"><h2>マップ・サーバー設定</h2><button type="button" id="closeServerSettings" class="icon-btn">×</button></div><form id="serverSettingsForm" class="form"><label class="field"><span>マップ</span><select id="settingsMap" required></select></label><label class="field"><span>サーバー番号</span><input id="settingsServer" type="text" inputmode="numeric" required placeholder="例：5999"></label><label class="field"><span>メモ（任意）</span><textarea id="settingsMemo" rows="2" placeholder="例：メイン拠点・資源用サーバー"></textarea></label><button class="submit-btn" type="submit">登録</button></form><div id="serverSettingsList" class="server-settings-list"></div></dialog>
    <dialog id="levelSettingsDialog" class="character-dialog" aria-label="レベル上限解放項目の設定">
      <div class="modal-header"><h2>レベル上限解放の設定</h2><button type="button" id="closeLevelSettings" class="icon-btn">×</button></div>
      <div class="form">
      <div id="levelSettingsList" class="level-settings-list"></div>
      <form id="levelRuleForm" class="level-rule-form"><input id="levelRuleEditId" type="hidden"><label class="field"><span>解放条件名</span><input id="levelRuleName" required maxlength="120" placeholder="例：新DLCのボスを討伐"></label><label class="field"><span>追加レベル</span><input id="levelRulePoints" type="number" required min="1" max="245" step="1" value="15"></label><button type="submit" class="submit-btn">条件を保存</button><button type="button" id="levelRuleCancel" class="manager-small-btn hidden">編集をキャンセル</button></form>
      </div></dialog>
    <input id="characterImageInput" class="hidden-input" type="file" accept="image/*">
    <dialog id="characterViewer" class="character-viewer" aria-label="画像を拡大"><button id="closeCharacterViewer" class="icon-btn" type="button" aria-label="閉じる">×</button><img id="characterViewerImage" alt=""></dialog>
    <div id="managerToast" class="manager-toast hidden" role="status"></div>
    <main id="timerPage" class="content hidden" role="tabpanel" aria-labelledby="timerTab">
      <section class="toolbar-card toolbar-card-compact">
        <select id="sortSelect" aria-label="並び順">
          <option value="dueSoon">期限が近い順</option>
          <option value="dueLate">期限が遠い順</option>
          <option value="name">名前順</option>
          <option value="map">マップ順</option>
          <option value="manual">手動並び替え</option>
        </select>
      </section>

      <section id="emptyState" class="empty-state">

        <h2>タイマーがありません</h2>

    <button id="add" class="fab hidden" type="button" aria-label="タイマー追加">＋</button>

            <option value="スコーチドアース">スコーチドアース</option>
            <option value="センター">センター</option>
            <option value="アベレーション">アベレーション</option>
            <option value="エクスティンクション">エクスティンクション</option>
            <option value="アストレオス">アストレオス</option>
            <option value="ラグナロク">ラグナロク</option>
            <option value="バルゲロ">バルゲロ</option>
            <option value="ロストコロニー">ロストコロニー</option>
            <option value="その他">その他</option>
          </select>
        </label>

        <div class="field">
          <span>マップ画像</span>
          <input id="imageInput" type="file" accept="image/*" class="hidden-input">
          <button id="imagePreviewButton" class="map-preview-button" type="button" aria-label="マップ画像を変更">
            <div id="imagePreview" class="map-preview is-empty">
              <div id="imagePreviewPin" class="map-pin hidden" aria-hidden="true"></div>

        <div class="field">

          </div>
          <label class="check-row">
            <input id="showPinInput" type="checkbox" checked>
            <span>座標にピンを表示</span>
          </label>
        </div>

        <label class="field">
          <span>種類</span>
          <select id="typeSelect" required>
            <option value="building">建築タイマー</option>
            <option value="tribe_tower">トライブタワー</option>
            <option value="generator">ジェネレータ</option>
            <option value="other">その他</option>
          </select>
        </label>

        <div id="materialField" class="field">
          <span>建材</span>
          <div class="chip-grid">
            <label class="chip"><input type="radio" name="material" value="わら"><span>わら</span></label>
            <label class="chip"><input type="radio" name="material" value="木"><span>木</span></label>
            <label class="chip"><input type="radio" name="material" value="石"><span>石</span></label>
            <label class="chip"><input type="radio" name="material" value="金属"><span>金属</span></label>
            <label class="chip"><input type="radio" name="material" value="TEK" checked><span>TEK</span></label>
          </div>
          <div id="materialDays" class="material-days">TEK 20日</div>
        </div>

        <div id="customTimerField" class="field hidden">
          <span>タイマー</span>
          <div class="time-grid">
            <input id="daysInput" type="number" min="0" step="1" value="" placeholder="日">
            <input id="hoursInput" type="number" min="0" max="23" step="1" value="" placeholder="時間">
            <input id="minutesInput" type="number" min="0" max="59" step="1" value="" placeholder="分">
          </div>
        </div>

        <label class="field">
          <span>メモ</span>
          <textarea id="memoInput" rows="3" placeholder="任意で入力"></textarea>
        </label>

        <button id="submitBtn" class="submit-btn" type="submit">追加して開始</button>
      </form>
    </section>

    <div id="confirmOverlay" class="confirm-overlay hidden">
      <div class="confirm-box">
        <h3 id="confirmTitle">確認</h3>
        <p id="confirmText">実行しますか？</p>
        <div class="confirm-actions">
          <button id="confirmCancel" class="confirm-btn ghost" type="button">キャンセル</button>
          <button id="confirmOk" class="confirm-btn solid" type="button">OK</button>
        </div>
      </div>
    </div>
  </div>
  <script>
const STORAGE_KEY='arkTimer_store_v8';
const MAPS=['アイランド','スコーチドアース','センター','アベレーション','エクスティンクション','アストレオス','ラグナロク','バルゲロ','ロストコロニー','その他'];
const DEFAULT_MAP_IMAGES={'アイランド':'IMG_3555.jpeg','スコーチドアース':'IMG_3556.jpeg','センター':'IMG_3557.webp','アベレーション':'IMG_3558.jpeg','エクスティンクション':'IMG_3559.jpeg','アストレオス':'12DB1A38-79FA-496C-9F06-F24C06567D9F.png','ラグナロク':'69640213-1F63-4F2F-8C97-1072ADA3AC83.jpeg','バルゲロ':'5F4DEDA4-23E1-425C-9C92-C43A614C19B1.png','ロストコロニー':'EC5D5564-E4FE-431C-999B-4FAE6F4848D6.png','その他':'IMG_3570.jpeg'};
const MAP_BOUNDS={'アイランド':{width:100,height:100},'スコーチドアース':{width:100,height:100},'センター':{width:100,height:100},'アベレーション':{width:100,height:100},'エクスティンクション':{width:100,height:100},'アストレオス':{width:100,height:100},'ラグナロク':{width:100,height:100},'バルゲロ':{width:100,height:100},'ロストコロニー':{width:100,height:100},'その他':{width:100,height:100}};
const TRIBE_TOWER_ICON='7369529A-E04B-4212-8F0A-F320CC106E5E.png';
const GENERATOR_ICON='026D0A6D-7E86-4E5E-823D-3DE7D2909B98.png';
const BUILDING_DURATIONS={'わら':4,'木':8,'石':12,'金属':16,'TEK':20};
const SORT_KEY='arkTimer_sort_mode';
const $=id=>document.getElementById(id);
const list=$('list'),addBtn=$('add'),sortSelect=$('sortSelect'),activeCount=$('activeCount'),emptyState=$('emptyState'),overlay=$('overlay'),modal=$('modal'),closeModalBtn=$('closeModal'),modalTitle=$('modalTitle'),submitBtn=$('submitBtn'),timerForm=$('timerForm'),editIdInput=$('editId'),imageModeInput=$('imageMode'),mapSelect=$('mapSelect'),typeSelect=$('typeSelect'),materialField=$('materialField'),customTimerField=$('customTimerField'),memoInput=$('memoInput'),timerNameInput=$('timerNameInput'),latInput=$('latInput'),lngInput=$('lngInput'),daysInput=$('daysInput'),hoursInput=$('hoursInput'),minutesInput=$('minutesInput'),imageInput=$('imageInput'),imagePreview=$('imagePreview'),imagePreviewButton=$('imagePreviewButton'),imagePreviewPin=$('imagePreviewPin'),showPinInput=$('showPinInput'),confirmOverlay=$('confirmOverlay'),confirmTitle=$('confirmTitle'),confirmText=$('confirmText'),confirmCancel=$('confirmCancel'),confirmOk=$('confirmOk'),materialDays=$('materialDays');
const state={timers:[],pendingCustomImage:'',confirmResolver:null,sortMode:'dueSoon'};

function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    state.timers=raw?JSON.parse(raw):[];
  }catch(e){
    state.timers=[];
  }
  try{
    state.sortMode=localStorage.getItem(SORT_KEY)||'dueSoon';
  }catch(e){
    state.sortMode='dueSoon';
  }
  normalizeTimers();
}

function normalizeTimers(){
  state.timers=state.timers.map((timer,index)=>({
    showPin:timer.showPin!==false,
    sortOrder:Number.isFinite(Number(timer.sortOrder))?Number(timer.sortOrder):index,
    ...timer
  }));
}

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state.timers));
  localStorage.setItem(SORT_KEY,state.sortMode);
}

function generateId(){return `timer_${Date.now()}_${Math.random().toString(36).slice(2,9)}`}
function getSelectedMaterial(){const checked=document.querySelector('input[name="material"]:checked');return checked?checked.value:'TEK'}
function updateMaterialDays(){const material=getSelectedMaterial();materialDays.textContent=`${material} ${BUILDING_DURATIONS[material]}日`}
function syncTypeUI(){const type=typeSelect.value;materialField.classList.toggle('hidden',type!=='building');customTimerField.classList.toggle('hidden',type==='building');if(type!=='building'){daysInput.value='';hoursInput.value='';minutesInput.value=''}updateMaterialDays()}
function getDefaultImageForMap(mapName){return DEFAULT_MAP_IMAGES[mapName]||''}
function setPreviewImage(src){imagePreview.style.backgroundImage=src?`url("${src}")`:'';imagePreview.classList.toggle('is-empty',!src)}
function getMapBounds(mapName){return MAP_BOUNDS[mapName]||{width:100,height:100}}
function clamp(num,min,max){return Math.min(max,Math.max(min,num))}
function parseCoord(value){const num=Number(String(value||'').trim());return Number.isFinite(num)?num:null}
function getPinPosition(mapName,lat,lng){
  const latNum=parseCoord(lat),lngNum=parseCoord(lng);
  if(latNum===null||lngNum===null)return null;
  const bounds=getMapBounds(mapName);
  const left=clamp((lngNum/bounds.width)*100,0,100);
  const top=clamp((latNum/bounds.height)*100,0,100);
  return {left,top};
}
function setPinElement(pinEl,mapName,lat,lng,showPin=true){
  if(!pinEl)return;
  const pos=showPin?getPinPosition(mapName,lat,lng):null;
  if(!pos){pinEl.classList.add('hidden');return}
  pinEl.classList.remove('hidden');
  pinEl.style.left=`${pos.left}%`;

 function installReorder(container,handleSelector,itemSelector,onOrder){
 let active=null,pointer=null,startY=0,engaged=false,timer=null;
 const stop=()=>{
  clearTimeout(timer);if(!active)return;
  const moved=active;active=null;pointer=null;moved.classList.remove('dragging');
  if(engaged)onOrder([...container.querySelectorAll(itemSelector)]);engaged=false;
 };
 container.addEventListener('pointerdown',e=>{
  const handle=e.target.closest(handleSelector);if(!handle)return;
  active=handle.closest(itemSelector);if(!active)return;
  pointer=e.pointerId;startY=e.clientY;engaged=false;
  handle.setPointerCapture(e.pointerId);
  timer=setTimeout(()=>{if(active){engaged=true;active.classList.add('dragging')}},180);
 });
 container.addEventListener('pointermove',e=>{
  if(!active||pointer!==e.pointerId)return;
  if(!engaged){if(Math.abs(e.clientY-startY)>12){clearTimeout(timer);active=null}return}
  e.preventDefault();
  const others=[...container.querySelectorAll(itemSelector)].filter(el=>el!==active);
  const next=others.find(el=>e.clientY<el.getBoundingClientRect().top+el.getBoundingClientRect().height/2);
  if(next)container.insertBefore(active,next);else container.appendChild(active);
  if(e.clientY<65)window.scrollBy(0,-12);else if(e.clientY>window.innerHeight-65)window.scrollBy(0,12);
 });
 container.addEventListener('pointerup',stop);
 container.addEventListener('pointercancel',stop);
 }

 for(const id of ['characterDialog','characterViewer'])$(id).addEventListener('click',e=>{if(e.target!==$(id))return;const r=$(id).getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog($(id))});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!confirmOverlay.classList.contains('hidden'))closeConfirm(false);else if(!modal.classList.contains('hidden'))closeModal()}});
 renderCharacters();(async()=>{try{if(location.protocol==='file:'||!('indexedDB' in window)){records=loadLocalRecords()}else{db=await openDatabase();records=await readRecords()}}catch(e){db=null;records=loadLocalRecords()}ready=true;renderCharacters()})();
})();
</script>
</body>
</html>
