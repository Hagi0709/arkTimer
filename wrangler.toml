name = "ark-manager"
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/push/*", "/", "/index.html", "/sw.js", "/push-client.js", "/data-transfer.js", "/build-info.json"]

[version_metadata]
binding = "CF_VERSION_METADATA"

[[d1_databases]]
binding = "DB"
database_name = "ark-manager-push"
database_id = "b02afda0-745f-4e81-ae52-90d8d08b731c"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[[previews.d1_databases]]
binding = "DB"
database_id = "95e72856-10b1-4a96-83e5-85c92b77eabd"
